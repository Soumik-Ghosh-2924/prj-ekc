apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ekc-application
  namespace: app-ekc-default
spec:
  project: default


  source:
    repoURL: https://github.com/Soumik-Ghosh-2924/prj-ekc.git
    targetRevision: HEAD
    path: k8s/dev/app_config
  destination:
    server: https://kubernetes.default.svc
    namespace: app-ekc-default

  syncPolicy:
    syncOptions:
      - CreateNamespace=true

    automated:
      selfHeal: true
      prune: true
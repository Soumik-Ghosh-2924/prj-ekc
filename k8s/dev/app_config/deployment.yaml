apiVersion: apps/v1
kind: Deployment
metadata:
  name: ekc-app
spec:
  selector:
    matchLabels:
      app: ekc-app
  # Phase 2 workspace and analysis state is process-local. Keep a single API
  # replica until that state is moved to a shared persistence boundary.
  replicas: 1
  revisionHistoryLimit: 2
  template:
    metadata:
      labels:
        app: ekc-app
    spec:
      containers:
        - name: ekc-app
          image: dockersg6/engineering-knowledge-compiler:stability-f39b034
          imagePullPolicy: Always
          env:
            - name: EKC_PHASE2_ENABLED
              value: "true"
            - name: COMPILER_ANALYSIS_MAX_SOURCE_FILES
              value: "2000"
            - name: COMPILER_ANALYSIS_MAX_SOURCE_BYTES
              value: "52428800"
            - name: COMPILER_WORKSPACE_ROOT
              value: "/workspace"
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: compiler-workspace
              mountPath: /workspace
      volumes:
        - name: compiler-workspace
          emptyDir:
            sizeLimit: 2Gi

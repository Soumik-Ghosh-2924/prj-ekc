apiVersion: apps/v1
kind: Deployment
metadata:
  name: ekc-phase2-ui
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: ekc-phase2-ui
  template:
    metadata:
      labels:
        app: ekc-phase2-ui
    spec:
      containers:
        - name: ui
          image: dockersg6/engineering-knowledge-compiler-ui:phase2-iteration2-79725b5
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ekc-phase2-api
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: ekc-phase2-api
  template:
    metadata:
      labels:
        app: ekc-phase2-api
    spec:
      containers:
        - name: api
          image: dockersg6/engineering-knowledge-compiler:phase2-iteration2-6df5a1d
          imagePullPolicy: Always
          env:
            - name: EKC_PHASE2_ENABLED
              value: "true"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
